
name: VIDHWAAN NEET GITHUB PAGES DEPLOY

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vidhwaan-neet-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: vidhwaan-neet

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Production Tools
        run: |
          set -euo pipefail
          npm install -g terser javascript-obfuscator clean-css-cli html-minifier-terser

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate NEET Source
        run: |
          set -euo pipefail

          npm run validate

          node --check generator/generate-day.js
          node --check public/js/app.js
          node --check public/sw.js
          node --check scripts/protect-data.js

          test -f public/index.html
          test -f public/css/main.css
          test -f public/js/app.js
          test -f public/sw.js
          test -f public/manifest.json
          test -f public/data/app-config.json
          test -f public/data/syllabus.json
          test -f public/data/credentials.json
          test -f scripts/protect-data.js

      - name: Prepare Production Dist
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist/css dist/js dist/data dist/icons

          cp public/index.html dist/index.html
          cp public/css/main.css dist/css/main.css
          cp public/js/app.js dist/js/app.js
          cp public/sw.js dist/sw.js
          cp public/manifest.json dist/manifest.json

          cp public/icons/icon-192.png dist/icons/icon-192.png
          cp public/icons/icon-512.png dist/icons/icon-512.png
          cp public/icons/favicon.ico dist/icons/favicon.ico
          cp public/icons/logo.png dist/icons/logo.png

          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi

      - name: Protect NEET Lesson And Credential Data
        env:
          NEET_DATA_KEY: ${{ secrets.NEET_DATA_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NEET_DATA_KEY:-}" ]; then
            echo "ERROR: NEET_DATA_KEY GitHub secret is missing."
            exit 1
          fi

          node scripts/protect-data.js

          test -f dist/data/credentials.dat

          echo "Lesson and credential protection passed."

      - name: Copy Static Data
        run: |
          set -euo pipefail

          cp public/data/app-config.json dist/data/app-config.json
          cp public/data/syllabus.json dist/data/syllabus.json

      - name: Verify Protected Data
        run: |
          set -euo pipefail

          SOURCE_COUNT=$(find public/data -maxdepth 1 -type f -name 'day-*.json' | wc -l)
          DAT_COUNT=$(find dist/data -maxdepth 1 -type f -name 'day-*.dat' | wc -l)

          test "$SOURCE_COUNT" -gt 0
          test "$DAT_COUNT" -eq "$SOURCE_COUNT"
          test -f dist/data/credentials.dat

          if find dist/data -maxdepth 1 -type f -name 'day-*.json' | grep -q .; then
            echo "ERROR: Plain lesson JSON found."
            exit 1
          fi

          echo "Protected lessons: $DAT_COUNT"
          echo "Protected credentials: credentials.dat"

      - name: Inject NEET Data Key
        env:
          NEET_DATA_KEY: ${{ secrets.NEET_DATA_KEY }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/js/app.js";
          const key = process.env.NEET_DATA_KEY;
          const placeholder = '"__NEET_DATA_KEY__"';

          let source = fs.readFileSync(file, "utf8");

          if (source.split(placeholder).length - 1 !== 1) {
            throw new Error("Expected exactly one NEET_DATA_KEY placeholder.");
          }

          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(key)) {
            throw new Error("NEET_DATA_KEY is invalid Base64.");
          }

          if (Buffer.from(key, "base64").length !== 32) {
            throw new Error("NEET_DATA_KEY must decode to 32 bytes.");
          }

          source = source.replace(placeholder, JSON.stringify(key));

          if (source.includes("__NEET_DATA_KEY__")) {
            throw new Error("NEET_DATA_KEY placeholder remains.");
          }

          fs.writeFileSync(file, source, "utf8");

          console.log("NEET_DATA_KEY injected.");
          NODE

          node --check dist/js/app.js

      - name: Minify CSS
        run: |
          set -euo pipefail

          cleancss -O2 dist/css/main.css -o dist/css/main.css

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/css/main.css";
          const source = fs.readFileSync(file, "utf8");
          fs.writeFileSync(file, source.replace(/\r?\n|\r/g, "").trim());
          NODE

      - name: Minify JavaScript
        run: |
          set -euo pipefail

          terser dist/js/app.js --compress --mangle -o dist/js/app.js

      - name: Obfuscate JavaScript
        run: |
          set -euo pipefail

          javascript-obfuscator dist/js/app.js \
            --output dist/js/app.js \
            --compact true \
            --control-flow-flattening false \
            --dead-code-injection false \
            --debug-protection false \
            --disable-console-output true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75

      - name: Verify Key Injection
        run: |
          set -euo pipefail

          if grep -Fq "__NEET_DATA_KEY__" dist/js/app.js; then
            echo "ERROR: Key placeholder remains."
            exit 1
          fi

          test -s dist/js/app.js

      - name: Generate Asset Version
        run: |
          set -euo pipefail

          VERSION=$(date +%s)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache Bust HTML Assets
        run: |
          set -euo pipefail

          sed -i "s|src=\"./js/app.js\"|src=\"./js/app.js?v=$VERSION\"|g" dist/index.html
          sed -i "s|href=\"./css/main.css\"|href=\"./css/main.css?v=$VERSION\"|g" dist/index.html
          sed -i "s|href=\"./manifest.json\"|href=\"./manifest.json?v=$VERSION\"|g" dist/index.html

      - name: Minify HTML
        run: |
          set -euo pipefail

          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            dist/index.html \
            -o dist/index.html

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/index.html";
          const source = fs.readFileSync(file, "utf8");
          fs.writeFileSync(file, source.replace(/\r?\n|\r/g, "").trim());
          NODE

      - name: Verify Production Build
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/css/main.css
          test -f dist/js/app.js
          test -f dist/sw.js
          test -f dist/manifest.json
          test -f dist/data/app-config.json
          test -f dist/data/syllabus.json
          test -f dist/data/credentials.dat

          SOURCE_COUNT=$(find public/data -maxdepth 1 -type f -name 'day-*.json' | wc -l)
          DAT_COUNT=$(find dist/data -maxdepth 1 -type f -name 'day-*.dat' | wc -l)

          test "$SOURCE_COUNT" -gt 0
          test "$DAT_COUNT" -eq "$SOURCE_COUNT"

          if find dist -type f -name 'day-*.json' | grep -q .; then
            echo "ERROR: Plain lesson JSON deployed."
            exit 1
          fi

          if find dist/data -maxdepth 1 -type f -name 'credentials.json' | grep -q .; then
            echo "ERROR: Plain credentials JSON deployed."
            exit 1
          fi

          echo "Production verification passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Success
        run: |
          echo "============================================================"
          echo " VIDHWAAN NEET — DEPLOYMENT SUCCESS"
          echo "============================================================"
          echo "Lessons: encrypted .dat"
          echo "Credentials: encrypted credentials.dat"
          echo "Plain lesson JSON: not deployed"
          echo "Plain credentials JSON: not deployed"
          echo "Deployment: GitHub Pages"
